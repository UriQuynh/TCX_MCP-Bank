# Stack tham khảo: mcp (HTTP mode, không TLS) + redis (rate-limit chia sẻ) + nginx (TLS termination).
# Chạy: cd deploy && docker compose --env-file ../.env up -d
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD bắt buộc}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks: [tcx_mcp]

  mcp:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3020"
      MCP_ALLOWED_HOSTS: ${MCP_PUBLIC_HOST:-mcp.tramchuxe.com}
      MCP_REQUIRE_HTTPS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BANK_PROVIDER: ${BANK_PROVIDER:-local}
      API_KEYS_FILE: /app/data/api-keys.json
      AUDIT_LOG_FILE: /app/data/audit.log
      LEDGER_DB_FILE: /app/data/ledger.sqlite
    volumes:
      - mcp_data:/app/data
    depends_on: [redis]
    networks: [tcx_mcp]
    # KHÔNG publish port 3020 ra host: chỉ nginx trong network mới gọi được

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/tcx-mcp-bank.conf:/etc/nginx/conf.d/tcx-mcp-bank.conf:ro
      - ${TLS_CERT_DIR:-./ssl}:/etc/nginx/ssl/tramchuxe:ro
    depends_on: [mcp]
    networks: [tcx_mcp]

volumes:
  mcp_data:

networks:
  tcx_mcp:
