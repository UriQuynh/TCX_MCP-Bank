# nginx reverse proxy + TLS termination cho TCX_MCP-Bank (server KHÔNG tự làm TLS).
# Đặt vào /etc/nginx/conf.d/ (hoặc TCX_Infra/nginx/conf.d/). Thay mcp.tramchuxe.com + đường dẫn cert.

limit_req_zone $binary_remote_addr zone=tcx_mcp:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tcx_mcp_webhook:10m rate=10r/s;

upstream tcx_mcp_bank {
    server 127.0.0.1:3020;   # docker: mcp:3020 trong cùng network compose
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.tramchuxe.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.tramchuxe.com;

    # Cloudflare Origin CA (pattern TCX_Infra) hoặc Let's Encrypt
    ssl_certificate     /etc/nginx/ssl/tramchuxe/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/tramchuxe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:tcx_mcp_ssl:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    # Tuỳ chọn mTLS: chỉ agent có client cert do CA nội bộ ký mới gọi được
    # ssl_client_certificate /etc/nginx/ssl/tcx-mcp-agent-ca.pem;
    # ssl_verify_client on;

    client_max_body_size 256k;

    location = /health {
        proxy_pass http://tcx_mcp_bank;
        proxy_set_header Host $host;
        access_log off;
    }

    location /mcp {
        limit_req zone=tcx_mcp burst=60 nodelay;

        proxy_pass http://tcx_mcp_bank;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # server check MCP_REQUIRE_HTTPS dựa vào header này

        # Streamable HTTP / SSE: không buffer, giữ kết nối dài
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /webhooks/ {
        limit_req zone=tcx_mcp_webhook burst=30 nodelay;
        # Nếu ngân hàng công bố dải IP gửi webhook -> allow/deny tại đây
        # allow 203.0.113.0/24; deny all;

        proxy_pass http://tcx_mcp_bank;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
